name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege: nothing grants credentials workflow-wide. Publishing jobs
# mint their own short-lived OIDC credentials below; job-level grants are the
# only place permissions widen.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    steps:
      # Pinned to commit SHAs: with trusted publishing, third-party action
      # tags are part of the publish trust chain. (dtolnay/rust-toolchain is
      # a deliberately moving branch ref — its point is stable Rust updates —
      # so it stays unpinned.)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation deps (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.ext == ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd "target/${{ matrix.target }}/release"
          tar czf "dirsweep-v${VERSION}-${{ matrix.target }}.tar.gz" dirsweep

      - name: Package (Windows)
        if: matrix.ext == '.exe'
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          cd "target/${{ matrix.target }}/release"
          Compress-Archive -Path dirsweep.exe -DestinationPath "dirsweep-v${version}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dirsweep-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/dirsweep-*

  create-release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # release assets are uploaded with the default GITHUB_TOKEN
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dirsweep-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum dirsweep-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          draft: false
          files: |
            dirsweep-*
            checksums.txt

  publish-crates:
    name: Publish to crates.io
    needs: [build]
    runs-on: ubuntu-latest
    environment: cicd
    permissions:
      contents: read
      id-token: write # needed to mint the short-lived crates.io token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify version matches git tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dirsweep") | .version')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: Git tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)" >&2
            exit 1
          fi

      - run: cargo check --locked

      # Trusted publishing: exchange the job's OIDC token for a ~1-minute
      # crates.io API token instead of holding a long-lived API token secret.
      # Requires the crates.io Trusted Publishing registration (repo +
      # workflow + environment) done once in the crates.io UI.
      - name: Exchange OIDC for a short-lived crates.io token
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-npm:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    environment: cicd
    permissions:
      contents: read
      id-token: write # needed for the npm provenance / trusted-publishing exchange
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Sync version + include assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          cp ../LICENSE .
          cp ../README.md .

      - name: Publish
        run: |
          cd npm
          npm publish --access public --provenance
